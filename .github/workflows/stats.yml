name: Hisse istatistikleri
on:
  schedule:
    - cron: '40 15 * * 1-5'   # hafta içi 18:40 (Türkiye)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Hisse istatistikleri
        run: node scripts/build-stats.mjs
        continue-on-error: true
      - name: Halka arz sonuçları ve SPK başvuruları
        run: node scripts/build-ipo-data.mjs
        continue-on-error: true
      - name: Kaydet
        run: |
          git config user.name "ipotrack-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Piyasa verileri güncellendi"
          git push
