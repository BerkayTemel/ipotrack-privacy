name: Hisse istatistikleri
on:
  schedule:
    - cron: '40 15 * * 1-5'   # hafta içi 18:40 (Türkiye)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-stats.mjs
      - name: Kaydet
        run: |
          git config user.name "ipotrack-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/stats.json
          git diff --cached --quiet || git commit -m "Hisse istatistikleri güncellendi"
          git push
